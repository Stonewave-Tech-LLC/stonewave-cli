[package]
name = "stonewave-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Stonewave server CLI: connect a server to Wave so its dev agent gets safe, scoped hands (early build)"
license = "Apache-2.0"
repository = "https://github.com/Stonewave-Tech-LLC/stonewave-cli"
publish = false

[[bin]]
name = "stonewave"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Own workspace root: this crate must never be pulled into another workspace by accident.
[workspace]
